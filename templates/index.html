<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MobileHub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="chat-card">
        <header>
          <h1 class="shop-name">MobileHub</h1>
        </header>
        <main id="chat-box">
          <div class="message bot">
            <div class="bubble">
              Welcome to MobileHub. How can we help you today?
            </div>
          </div>
        </main>
        <footer>
          <div class="input-area">
            <input
              type="text"
              id="user-input"
              placeholder="Type your question..."
            />
            <button id="send-btn">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </footer>
      </div>
    </div>
    <div id="toast"></div>
    <script src="/static/js/script.js"></script>
  </body>
</html>
